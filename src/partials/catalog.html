<section class="container-site pb-section-sm pt-6 lg:pt-8" data-catalog data-preset='{{preset}}'>
  <nav aria-label="Breadcrumb" class="breadcrumb">
    <ol role="list"><li><a href="{{home}}">Home</a></li><li><span aria-current="page" data-catalog-crumb>{{crumb}}</span></li></ol>
  </nav>
  <header class="mt-8 grid-site items-end gap-y-4 lg:mt-12">
    <div class="col-span-full lg:col-span-7">
      <p class="type-label text-neutral-600">{{eyebrow}}</p>
      <h1 class="type-h1 mt-3">{{heading}}</h1>
    </div>
    <p class="type-body col-span-full max-w-[52ch] text-neutral-600 lg:col-span-5" data-catalog-intro>{{intro}}</p>
  </header>

  <div class="catalog-toolbar mt-10">
    <button class="btn btn-secondary lg:hidden" type="button" data-filter-open aria-controls="filter-dialog" aria-expanded="false">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg>
      Filter <span data-filter-count></span>
    </button>
    <p class="type-body-sm text-neutral-600" aria-live="polite"><span data-count>Loading products</span></p>
    <div class="flex items-center gap-3 lg:ml-auto">
      <label class="type-label hidden text-neutral-600 sm:block" for="sort">Sort</label>
      <select class="select" id="sort" data-sort>
        <option value="featured">Featured</option>
        <option value="newest">Newest</option>
        <option value="price-asc">Price, low to high</option>
        <option value="price-desc">Price, high to low</option>
      </select>
    </div>
  </div>
  <div class="mt-4 flex flex-wrap items-center gap-2" data-active-filters hidden></div>

  <div class="mt-8 grid-site gap-y-10">
    <aside class="hidden lg:col-span-3 lg:block" aria-label="Filters">
      <form class="filters-sticky" data-filters="desktop" onsubmit="return false"></form>
    </aside>
    <div class="col-span-full lg:col-span-9">
      <div class="product-grid" data-results aria-live="polite"></div>
    </div>
  </div>
</section>

<dialog class="dialog drawer-dialog drawer-left" id="filter-dialog" aria-labelledby="filter-dialog-title" data-filter-dialog>
  <div class="flex h-full flex-col">
    <div class="flex h-(--nav-h) shrink-0 items-center justify-between border-b border-neutral-200 px-6">
      <h2 class="type-label" id="filter-dialog-title">Filter</h2>
      <button class="icon-btn -mr-3" type="button" aria-label="Close filters" data-dialog-close>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </div>
    <form class="flex-1 overflow-y-auto px-6" data-filters="mobile" onsubmit="return false"></form>
    <div class="flex shrink-0 gap-3 border-t border-neutral-200 px-6 py-5">
      <button class="btn btn-secondary flex-1" type="button" data-clear-filters>Clear all</button>
      <button class="btn btn-primary flex-1" type="button" data-filter-apply>Show <span class="ml-1" data-count></span></button>
    </div>
  </div>
</dialog>
