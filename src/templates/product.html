description: {{productDescription}}
script: product
ogType: product

<div data-pdp data-slug="{{productSlug}}">
  <h1 class="sr-only">{{productName}}</h1>
  <div class="container-site grid-site gap-y-8 py-12" aria-busy="true">
    <div class="col-span-full aspect-[4/5] bg-bone lg:col-span-7"></div>
    <div class="col-span-full space-y-4 lg:col-span-5 lg:col-start-8">
      <div class="h-4 w-24 bg-neutral-100"></div><div class="h-10 w-3/4 bg-neutral-100"></div><div class="h-6 w-28 bg-neutral-100"></div>
    </div>
  </div>
</div>

<section class="container-site border-t border-neutral-200 py-section-sm" aria-labelledby="related-title">
  <h2 class="type-h2" id="related-title">You might also like</h2>
  <div class="product-grid product-grid-4 mt-8" data-related></div>
</section>

<dialog class="dialog drawer-dialog" id="size-guide" aria-labelledby="size-guide-title">
  <div class="flex h-full flex-col">
    <div class="flex h-(--nav-h) shrink-0 items-center justify-between border-b border-neutral-200 px-6">
      <h2 class="type-label" id="size-guide-title">Size guide</h2>
      <button class="icon-btn -mr-3" type="button" aria-label="Close size guide" data-dialog-close>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </div>
    <div class="flex-1 overflow-y-auto px-6 py-6" data-size-guide-body></div>
  </div>
</dialog>
