<!--
title: Create account — DUBLIN/01
description: Create a DUBLIN/01 account to track orders, save addresses and keep your wishlist.
script: account
robots: noindex
-->
<section class="container-site pb-section pt-10 lg:pt-14">
  <div class="grid-site gap-y-12">
    <div class="col-span-full md:col-span-6 md:col-start-2 lg:col-span-5 lg:col-start-1">
      <h1 class="type-h1">Create account</h1>
      <form class="mt-10 space-y-6" novalidate data-account-form="register">
        <div class="form-grid">
          <div class="field"><label class="field-label" for="reg-first">First name</label>
            <input class="input" id="reg-first" name="firstName" autocomplete="given-name" required data-error="Enter your first name." /></div>
          <div class="field"><label class="field-label" for="reg-last">Last name</label>
            <input class="input" id="reg-last" name="lastName" autocomplete="family-name" required data-error="Enter your last name." /></div>
        </div>
        <div class="field"><label class="field-label" for="reg-email">Email</label>
          <input class="input" id="reg-email" name="email" type="email" autocomplete="email" required data-error="Enter your email address." /></div>
        <div class="field"><div class="flex items-baseline justify-between"><label class="field-label" for="reg-password">Password <span class="field-hint">at least 8 characters</span></label>
          <button class="link-subtle type-body-sm" type="button" data-toggle-password aria-controls="reg-password" aria-pressed="false">Show</button></div>
          <input class="input" id="reg-password" name="password" type="password" autocomplete="new-password" required data-error="Choose a password." /></div>
        <div class="field"><label class="check" for="reg-terms"><input type="checkbox" id="reg-terms" name="terms" required data-error="Accept the terms to create an account." />
          <span>I accept the <a class="link-editorial" href="{{base}}terms.html">terms</a> and have read the <a class="link-editorial" href="{{base}}privacy.html">privacy policy</a>.</span></label></div>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
        <div class="notice" tabindex="-1" role="status" data-account-status hidden>
          <p class="type-body-sm">Customer accounts are not open yet. No account was created and nothing you typed was sent or stored.</p>
        </div>
        <p class="type-body-sm"><a class="link-editorial" href="{{base}}login.html">I already have an account</a></p>
      </form>
    </div>
    <div class="col-span-full md:col-span-6 md:col-start-2 lg:col-span-5 lg:col-start-8">
      <div class="summary">
        <h2 class="type-h3">Already with us?</h2>
        <ul class="type-body mt-6 space-y-3 text-neutral-600" role="list">
          <li>Track orders and start returns online</li>
          <li>Save addresses for faster checkout</li>
          <li>Keep your wishlist on every device</li>
        </ul>
        <a class="btn btn-secondary btn-block mt-8" href="{{base}}login.html">Sign in</a>
      </div>
    </div>
  </div>
</section>
