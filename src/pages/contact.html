<!--
title: Contact — DUBLIN/01
description: Contact DUBLIN/01 customer support about sizing, orders, delivery or returns.
script: contact
-->
<section class="container-site pb-section pt-6 lg:pt-8">
  <!-- @include info-head crumb='Contact' eyebrow='Help' heading='Talk to us' intro='Questions about sizing, an order or a return. We reply within one working day, Monday to Friday, 9am to 5pm.' -->
  <div class="mt-12 grid-site gap-y-12">
    <form class="col-span-full space-y-6 lg:col-span-6" novalidate data-contact>
      <div class="form-grid">
        <div class="field"><label class="field-label" for="contact-name">Name</label>
          <input class="input" id="contact-name" name="name" autocomplete="name" required data-error="Enter your name." /></div>
        <div class="field"><label class="field-label" for="contact-email">Email</label>
          <input class="input" id="contact-email" name="email" type="email" autocomplete="email" required data-error="Enter your email address." /></div>
      </div>
      <div class="field"><label class="field-label" for="contact-topic">Topic</label>
        <select class="select select-block" id="contact-topic" name="topic" required data-error="Choose a topic.">
          <option value="">Choose a topic</option><option>Sizing</option><option>An existing order</option><option>Delivery</option><option>Returns</option><option>Something else</option>
        </select></div>
      <div class="field"><label class="field-label" for="contact-order">Order number <span class="field-hint">optional</span></label>
        <input class="input" id="contact-order" name="order" /></div>
      <div class="field"><label class="field-label" for="contact-message">Message</label>
        <textarea class="input min-h-40 py-3" id="contact-message" name="message" required data-error="Write a short message."></textarea></div>
      <button class="btn btn-primary" type="submit">Send message</button>
      <div class="notice" tabindex="-1" role="status" data-contact-status hidden>
        <p class="type-body-sm">Messaging isn’t connected in this preview, so this message was not sent. Nothing was stored.</p>
      </div>
    </form>
    <aside class="col-span-full lg:col-span-4 lg:col-start-9">
      <dl class="space-y-8">
        <div><dt class="type-label text-neutral-600">Hours</dt><dd class="type-body mt-2">Monday to Friday, 9am–5pm</dd></div>
        <div><dt class="type-label text-neutral-600">Based in</dt><dd class="type-body mt-2">Dublin, Ireland. Online only for now.</dd></div>
        <div><dt class="type-label text-neutral-600">Before you write</dt><dd class="type-body mt-2"><a class="link-editorial" href="{{base}}faq.html">FAQ</a> · <a class="link-editorial" href="{{base}}delivery.html">Delivery</a> · <a class="link-editorial" href="{{base}}returns.html">Returns</a></dd></div>
      </dl>
    </aside>
  </div>
</section>
